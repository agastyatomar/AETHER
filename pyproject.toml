[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aether"
version = "0.1.0"
description = "AETHER — voice-driven meta-orchestrator that turns one spoken request into a fleet of self-checking AI agents"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Aadi Tomar", email = "agastyatomar@example.com"}
]
maintainers = [
    {name = "Aadi Tomar", email = "agastyatomar@example.com"}
]
keywords = ["ai", "agents", "orchestration", "voice", "automation", "browser-automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.8.0",
    "aiosqlite>=0.20.0",
    "filelock>=3.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "watchdog>=4.0.0",
]
docs = [
    "watchdog>=4.0.0",
]
browser = [
    "browser-use>=0.13.10",
    "playwright>=1.62.0",
]
web = [
    "fastapi>=0.110.0,<0.125.0",
    "uvicorn>=0.29.0",
]
termux = [
    "pydantic>=2.8.0",
    "aiosqlite>=0.20.0",
    "filelock>=3.15.0",
]

[project.urls]
Homepage = "https://github.com/agastyatomar/AETHER"
Repository = "https://github.com/agastyatomar/AETHER"
Issues = "https://github.com/agastyatomar/AETHER/issues"
Documentation = "https://github.com/agastyatomar/AETHER/wiki"

[project.scripts]
aether = "aether.cli:main"
aether-browser-install = "aether.society.browser.install:main"
aether-society = "aether.society.runtime:main"
aether-gui-install = "aether.gui_install:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aether*"]

[tool.setuptools.package-dir]
"" = "."

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "T20", "SIM", "RUF"]
ignore = ["E501", "SIM102", "SIM103"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
show_error_codes = true
pretty = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["aether"]
omit = ["tests/*", "*/bootstrap/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]